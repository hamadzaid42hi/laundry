<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al Rams Laundry — Staff</title><link rel="stylesheet" href="styles.css?v=2"></head><body>
<div id="login" class="login"><form id="loginForm" class="card"><div class="brand"><div class="logo">🧺</div><div><h2 data-t="brand">Al Rams Laundry</h2><small data-t="staffLogin">Staff sign in</small></div></div><div class="field"><label data-t="username">Username</label><input id="username" autocomplete="username" required></div><div class="field"><label data-t="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><p id="loginError" class="error"></p><button class="btn" data-t="signin">Sign in</button></form></div>
<header class="top"><div class="brand"><div class="logo">🧺</div><div><b data-t="brand">Al Rams Laundry</b><small data-t="hours">Open 8 AM–11 PM</small></div></div><div class="actions"><a class="btn secondary" href="admin.html" data-t="admin">Admin</a><button id="lang" class="btn secondary lang">AR</button><button id="logout" class="btn danger"><span class="label" data-t="logout">Logout</span> ↪</button></div></header>
<main class="shell"><div class="grid"><section><div class="card"><h2 data-t="newOrder">New order</h2><div class="fields"><div class="field"><label data-t="phone">Customer phone</label><input id="phone" inputmode="tel" placeholder="05X XXX XXXX"><small id="customerHint" class="tiny"></small></div><div class="field"><label data-t="name">Customer name</label><input id="customerName"></div><div class="field"><label data-t="expected">Expected completion</label><input id="expected" type="datetime-local"></div><div class="field"><label data-t="notes">Notes</label><input id="notes"></div></div><div id="customerProfile" class="customer-profile hidden"></div></div>
<div class="card visual-picker"><div class="order-head"><h2 data-t="addItems">Add items</h2><input id="itemSearch" class="search" data-t-placeholder="searchItems" placeholder="Search items"></div><div id="quickItems"></div><p class="picker-step" data-t="chooseCategory">1. Choose a category</p><div id="categoryCards" class="photo-grid categories"></div><p class="picker-step" data-t="chooseItem">2. Choose an item</p><div id="itemCards" class="photo-grid items"></div><div class="hidden"><select id="category"></select><select id="item"></select><select id="service"></select></div><div class="picker-options"><div id="sizeWrap" class="field hidden"><label data-t="size">Size</label><select id="size"></select></div><label class="field-label" data-t="service">Service</label><div id="serviceButtons" class="service-buttons"></div><label class="field-label" data-t="quantity">Quantity</label><div class="qty-control"><button type="button" onclick="changeQty(-1)">−</button><input id="quantity" type="number" min="1" max="999" value="1"><button type="button" onclick="changeQty(1)">+</button></div><div id="dimensions" class="field hidden"><label data-t="dimensions">Width × height (m)</label><div class="actions"><input id="width" type="number" step=".1" min=".1" placeholder="W"><input id="height" type="number" step=".1" min=".1" placeholder="H"></div></div></div><button id="addItem" class="btn gold add-large" data-t="add">Add to basket</button><p id="itemError" class="error"></p></div>
<div class="card"><div class="order-head"><h2 data-t="todayOrders">Orders</h2><input id="orderSearch" class="search" data-t-placeholder="search"></div><div id="orderTabs" class="tabs"></div><div id="orders"></div></div></section>
<aside><div class="card sticky"><h2 data-t="basket">Order basket</h2><div id="basket"><p class="tiny" data-t="empty">No items yet</p></div><div class="totals"><span data-t="subtotal">Subtotal</span><b id="subtotal">AED 0.00</b><span data-t="vat">VAT 5%</span><b id="vat">AED 0.00</b><span class="total" data-t="total">Total</span><b id="total" class="total">AED 0.00</b></div><div class="fields" style="margin-top:15px"><div class="field"><label data-t="paid">Amount paid</label><input id="paid" type="number" min="0" step=".01" value="0"></div><div class="field"><label data-t="payment">Payment method</label><select id="payment"><option value="" data-t="unpaid">Unpaid</option><option value="cash" data-t="cash">Cash</option><option value="card" data-t="card">Card</option><option value="bank" data-t="bank">Bank transfer</option></select></div></div><p id="orderError" class="error"></p><button id="confirm" class="btn" style="width:100%;margin-top:13px" disabled data-t="confirm">Confirm order</button></div></aside></div></main>
<section id="receipt" class="receipt"></section><script src="shared.js?v=4"></script><script src="staff.js?v=5"></script></body></html>
