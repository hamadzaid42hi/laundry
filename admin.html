<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al Rams Laundry — Admin</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="login" class="login"><form id="loginForm" class="card"><h2>🔐 <span data-t="adminLogin">Admin sign in</span></h2><div class="field"><label data-t="username">Username</label><input id="username" required></div><div class="field"><label data-t="password">Password</label><input id="password" type="password" required></div><p id="loginError" class="error"></p><button class="btn" data-t="signin">Sign in</button></form></div>
<header class="top"><div class="brand"><div class="logo">📊</div><div><b data-t="adminDashboard">Admin dashboard</b><small data-t="brand">Al Rams Laundry</small></div></div><div class="actions"><a class="btn secondary" href="staff.html" data-t="staff">Staff</a><a class="btn gold" href="/api/admin/export.csv" data-t="export">Export CSV</a><button id="lang" class="btn secondary">AR</button><button id="logout" class="btn danger" data-t="logout">Logout</button></div></header>
<main class="shell"><section class="metric-grid"><div class="metric"><span data-t="todayOrders">Today’s orders</span><b id="mOrders">0</b></div><div class="metric"><span data-t="todaySales">Today’s gross</span><b id="mGross">AED 0</b></div><div class="metric"><span data-t="paidSales">Paid today</span><b id="mPaid">AED 0</b></div><div class="metric"><span data-t="outstanding">Outstanding</span><b id="mOutstanding">AED 0</b></div></section><div class="grid" style="margin-top:20px"><section><div class="card"><div class="order-head"><h2 data-t="allOrders">All orders</h2><input id="search" class="search" data-t-placeholder="search"></div><div class="tabs" id="tabs"></div><div class="table-wrap"><table><thead><tr><th data-t="reference">Reference</th><th data-t="customer">Customer</th><th data-t="status">Status</th><th data-t="total">Total</th><th data-t="paid">Paid</th><th data-t="balance">Balance</th><th data-t="created">Created</th></tr></thead><tbody id="orders"></tbody></table></div></div></section><aside><div class="card"><h3 data-t="statusSummary">Status summary</h3><div id="statusSummary"></div></div><div class="card"><h3 data-t="paymentSummary">Payments today</h3><div id="paymentSummary"></div></div><div class="card"><h3 data-t="whatsapp">WhatsApp notifications</h3><div id="whatsapp"></div></div></aside></div></main><script src="shared.js"></script><script src="admin.js"></script></body></html>
